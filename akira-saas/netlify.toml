[build]
  command = "npm run build"
  publish = "dist"
  environment = { NODE_VERSION = "20.0.0" }

[build.environment]
  VITE_SUPABASE_URL = "$VITE_SUPABASE_URL"
  VITE_SUPABASE_ANON_KEY = "$VITE_SUPABASE_ANON_KEY"
  VITE_GOOGLE_AI_KEY = "$VITE_GOOGLE_AI_KEY"

# Redirigir URLs sin extensión a index.html (SPA routing)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Caché agresivo para assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# No cachear HTML
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Performance hints
[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "font/woff2; charset=utf-8"

# API proxy (si necesitas)
[[redirects]]
  from = "/api/*"
  to = "https://api.akira-os.com/:splat"
  status = 200
  force = false

# Analytics & monitoring
[functions]
  directory = "netlify/functions"

# Context específicos
[context.production]
  command = "npm run build"
  environment = { NODE_ENV = "production" }

[context.deploy-preview]
  command = "npm run build"
  environment = { NODE_ENV = "staging" }

[context.branch-deploy]
  command = "npm run build"
  environment = { NODE_ENV = "development" }
