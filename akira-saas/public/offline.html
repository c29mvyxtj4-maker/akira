<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AKIRA OS — Sin conexión</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #060608;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container { text-align: center; max-width: 320px; }
    .logo {
      width: 64px; height: 64px;
      border-radius: 16px;
      background: linear-gradient(135deg, #e63946, #cc2936);
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; font-weight: 900; color: #fff;
      margin: 0 auto 24px;
      box-shadow: 0 0 32px rgba(230,57,70,0.4);
    }
    h1 { font-size: 22px; font-weight: 800; margin-bottom: 10px; }
    p { font-size: 14px; color: rgba(255,255,255,0.5); line-height: 1.6; margin-bottom: 28px; }
    .btn {
      padding: 10px 24px; border-radius: 10px;
      background: linear-gradient(135deg, #e63946, #cc2936);
      color: #fff; font-size: 13px; font-weight: 700;
      border: none; cursor: pointer;
      box-shadow: 0 4px 16px rgba(230,57,70,0.35);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">A</div>
    <h1>Sin conexion</h1>
    <p>AKIRA necesita internet para funcionar. Comprueba tu conexion y vuelve a intentarlo.</p>
    <button class="btn" onclick="window.location.reload()">Reintentar</button>
  </div>
</body>
</html>
